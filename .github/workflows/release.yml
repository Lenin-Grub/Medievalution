name: Release Build

on:
  push:
    branches:
      - Release

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up CMake
      uses: lukka/get-cmake@latest

    - name: Install vcpkg
      run: |
        git clone https://github.com/microsoft/vcpkg.git
        .\vcpkg\bootstrap-vcpkg.bat

    - name: Install SFML
      run: |
        .\vcpkg\vcpkg install sfml:x64-windows

    - name: Install spdlog
      run: |
        .\vcpkg\vcpkg install spdlog:x64-windows

    - name: Install ImGui-SFML
      run: |
        .\vcpkg\vcpkg install imgui-sfml:x64-windows

    - name: Install entt
      run: |
        .\vcpkg\vcpkg install entt:x64-windows

    - name: Configure CMake
      run: |
        cmake -B build -S . -DCMAKE_TOOLCHAIN_FILE=./vcpkg/scripts/buildsystems/vcpkg.cmake

    - name: Build
      run: |
        cmake --build build --config Release

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.0.0
        name: Release v1.0.0
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.RELEASE }}

    - name: Prepare Release Assets
      run: |
        mkdir release
        copy bin\Release\Medievalution.exe release\
        xcopy /E /I config release\config\
        xcopy /E /I resources release\resources\
        xcopy /E /I shaders release\shaders\
        xcopy /E /I translation release\translation\
        copy ext_libs\openal32.dll release\

    - name: Create ZIP Archive
      run: |
        Compress-Archive -Path release\* -DestinationPath Medievalution.zip

    - name: Upload Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.RELEASE }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: Medievalution.zip
        asset_name: Medievalution.zip
        asset_content_type: application/zip
