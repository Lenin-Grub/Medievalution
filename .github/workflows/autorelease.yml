name: CMake Build and Release for Windows

on:
  push:
    branches:
      - Release

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v1

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v1
        with:
          cmake-version: '3.21.2'

      - name: Install dependencies
        run: |
          choco install -y --no-progress vcpkg
          vcpkg integrate install
          vcpkg install sfml spdlog entt

      - name: Create build directory
        run: |
          mkdir build
          cd build
          cmake .. -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=c:/vcpkg/scripts/buildsystems/vcpkg.cmake -DWARNINGS_AS_ERRORS=OFF

      - name: Build project
        run: |
          cd build
          cmake --build . --config Release --verbose

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: 'v${{ github.run_number }}'
          release_name: 'Release ${{ github.run_number }}'
          draft: false
          prerelease: false

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./bin/Release/Medievalution.exe
          asset_name: Medievalution.exe
          asset_content_type: application/octet-stream

      - name: Copy Resource Files
        run: |
          mkdir -p $GITHUB_WORKSPACE/{config,translation,resources,shaders}
          cp -r build/config build/translation build/resources build/shaders build/openal32.dll $GITHUB_WORKSPACE/

      - name: Upload Resource Files to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: |
            $GITHUB_WORKSPACE/config
            $GITHUB_WORKSPACE/translation
            $GITHUB_WORKSPACE/resources
            $GITHUB_WORKSPACE/shaders
            $GITHUB_WORKSPACE/openal32.dll
          asset_name: |
            config
            translation
            resources
            shaders
            openal32.dll
          asset_content_type: application/octet-stream
