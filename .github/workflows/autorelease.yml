name: Release

on:
  push:
    branches:
      - Release

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Visual Studio
        uses: microsoft/setup-msbuild@v1
        with:
          vs-version: 'latest'  # Убедитесь, что у вас установлена последняя версия Visual Studio

      - name: Find Visual Studio
        id: vs
        run: |
          Write-Host "Finding Visual Studio installation..."
          $VS_PATH = & 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe' -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          Write-Host "VS_PATH=$VS_PATH" >> $GITHUB_ENV

      - name: Configure CMake
        run: |
          cmd /c "${{ env.VS_PATH }}\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S . -B build -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmd /c "${{ env.VS_PATH }}\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake --build build --config Release

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.0
          release_name: Release v1.0.0
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          upload_artifact: true
          asset_path: build/bin/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}