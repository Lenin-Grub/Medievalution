name: CMake Build and Release

on:
  push:
    branches:
      - Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsfml-dev libx11-dev libxrandr-dev libudev-dev libopenal-dev libflac-dev libvorbis-dev libxcursor-dev

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v1
        with:
          cmake-version: '3.21.2'

      - name: Create build directory
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release

      - name: Build project
        run: |
          cd build
          cmake --build . --config Release

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: 'v${{ github.run_number }}'
          release_name: 'Release ${{ github.run_number }}'
          draft: false
          prerelease: false

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./bin/Release/
          asset_name: Medievalution
          asset_content_type: application/octet-stream

      - name: Copy Resource Files
        run: |
          mkdir -p $GITHUB_WORKSPACE/{config,translation,resources,shaders}
          cp -r build/config build/translation build/resources build/shaders build/openal32.dll $GITHUB_WORKSPACE/

      - name: Upload Resource Files to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: |
            $GITHUB_WORKSPACE/config
            $GITHUB_WORKSPACE/translation
            $GITHUB_WORKSPACE/resources
            $GITHUB_WORKSPACE/shaders
            $GITHUB_WORKSPACE/openal32.dll
          asset_name: |
            config
            translation
            resources
            shaders
            openal32.dll
          asset_content_type: application/octet-stream
